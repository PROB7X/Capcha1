<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HELM77ZX Captcha & Promo</title>
    
    <!-- Подключаем шрифт Font Awesome для иконок -->
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        :root {
            --primary-color: #2563eb;
            --success-color: #16a34a;
            --neutral-dark: #1e293b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #e0e7ff 0%, #f3e8ff 100%);
            margin: 0;
        }

        /* --- КОНТЕЙНЕР ДЛЯ СМЕНЫ БЛОКОВ --- */
        .app-container {
            position: relative;
            width: 320px;
            height: 76px;
        }

        /* --- 1. ВИДЖЕТ КАПЧИ --- */
        .captcha-widget {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            height: 100%;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 0 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            box-sizing: border-box;
            transition: all 0.4s ease;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 1;
            z-index: 2;
        }

        /* Эффект исчезновения виджета */
        .captcha-widget.fade-out {
            opacity: 0;
            transform: scale(0.9) translateY(-10px);
            pointer-events: none;
        }

        .captcha-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .checkbox-wrapper {
            position: relative;
            width: 26px;
            height: 26px;
        }

        .captcha-checkbox {
            width: 100%;
            height: 100%;
            border: 2px solid #cbd5e1;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
        }

        .captcha-checkbox:hover {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
        }

        .captcha-checkbox i {
            color: white;
            font-size: 14px;
            transform: scale(0);
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .captcha-loader {
            position: absolute;
            top: 0;
            left: 0;
            width: 26px;
            height: 26px;
            border: 3px solid #e2e8f0;
            border-top-color: var(--primary-color);
            border-radius: 50%;
            opacity: 0;
            pointer-events: none;
            box-sizing: border-box;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Состояния анимации */
        .checkbox-wrapper.loading .captcha-checkbox { opacity: 0; transform: scale(0.8); pointer-events: none; }
        .checkbox-wrapper.loading .captcha-loader { opacity: 1; animation: spin 0.8s linear infinite; }
        .checkbox-wrapper.checked .captcha-checkbox { background: var(--success-color); border-color: var(--success-color); pointer-events: none; }
        .checkbox-wrapper.checked .captcha-checkbox i { transform: scale(1); }

        .captcha-text {
            font-size: 15px;
            color: #334155;
            font-weight: 500;
            user-select: none;
            cursor: pointer;
        }

        .captcha-right {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .captcha-icon {
            font-size: 24px;
            color: var(--primary-color);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }

        .captcha-brand {
            font-size: 10px;
            font-weight: 700;
            color: #64748b;
            letter-spacing: 0.5px;
        }

        /* --- 2. БЛОК С КОДОМ (ПОЯВЛЯЕТСЯ ПОСЛЕ ПРОВЕРКИ) --- */
        .code-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            box-sizing: border-box;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            transform: scale(0.8) translateY(20px);
            pointer-events: none;
            height: auto;
            z-index: 1;
        }

        /* Эффект плавного появления блока с кодом */
        .code-container.fade-in {
            opacity: 1;
            transform: scale(1) translateY(0);
            pointer-events: auto;
        }

        .code-title {
            font-size: 14px;
            color: #64748b;
            font-weight: 600;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .code-box {
            font-family: 'Courier New', Courier, monospace;
            font-size: 24px;
            font-weight: 800;
            color: var(--neutral-dark);
            background: #f1f5f9;
            padding: 8px 24px;
            border-radius: 8px;
            border: 2px dashed #cbd5e1;
            letter-spacing: 2px;
            margin-bottom: 16px;
            user-select: all;
        }

        .copy-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            width: 100%;
            justify-content: center;
        }

        .copy-btn:hover { background: #1d4ed8; }
        .copy-btn:active { transform: scale(0.98); }
        .copy-btn.copied { background: var(--success-color); }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- БЛОК 1: ВИДЖЕТ КАПЧИ -->
        <div class="captcha-widget" id="captcha-widget">
            <div class="captcha-left" id="widget-click-zone">
                <div class="checkbox-wrapper" id="loader-wrapper">
                    <div class="captcha-checkbox">
                        <i class="fas fa-check"></i>
                    </div>
                    <div class="captcha-loader"></div>
                </div>
                <span class="captcha-text">Я не робот</span>
            </div>
            
            <div class="captcha-right">
                <i class="fas fa-shield-halved captcha-icon"></i>
                <span class="captcha-brand">HELM77ZX</span>
            </div>
        </div>

        <!-- БЛОК 2: ОКНО С ПОЛУЧЕННЫМ КОДОМ -->
        <div class="code-container" id="code-container">
            <div class="code-title">Ваш секретный код:</div>
            <div class="code-box" id="secret-code">MY_K7D</div>
            <button class="copy-btn" id="copy-btn">
                <i class="fas fa-copy" id="btn-icon"></i>
                <span id="btn-text">Скопировать код</span>
            </button>
        </div>

    </div>
    <script>
        const widgetClickZone = document.getElementById('widget-click-zone');
        const loaderWrapper = document.getElementById('loader-wrapper');
        const captchaWidget = document.getElementById('captcha-widget');
        const codeContainer = document.getElementById('code-container');
        const copyBtn = document.getElementById('copy-btn');
        const btnIcon = document.getElementById('btn-icon');
        const btnText = document.getElementById('btn-text');
        const secretCode = document.getElementById('secret-code').innerText;

        let isChecked = false;

        // 1. Логика клика по виджету капчи
        widgetClickZone.addEventListener('click', () => {
            if (isChecked) return;
            
            loaderWrapper.classList.add('loading');
            
            // Проверка длится 1.2 секунды
            setTimeout(() => {
                loaderWrapper.classList.remove('loading');
                loaderWrapper.classList.add('checked');
                isChecked = true;
                
                // Переключение экранов через 0.6 сек после галочки
                setTimeout(() => {
                    captchaWidget.classList.add('fade-out');
                    codeContainer.classList.add('fade-in');
                }, 600);

            }, 1200);
        });

        // 2. Логика копирования кода в буфер обмена
        copyBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(secretCode).then(() => {
                // Эффект успешного копирования
                copyBtn.classList.add('copied');
                btnIcon.className = 'fas fa-check';
                btnText.innerText = 'Скопировано!';
                
                // Сброс состояния кнопки обратно через 2 секунды
                setTimeout(() => {
                    copyBtn.classList.remove('copied');
                    btnIcon.className = 'fas fa-copy';
                    btnText.innerText = 'Скопировать код';
                }, 2000);
            }).catch(err => {
                console.error('Ошибка при копировании: ', err);
            });
        });
    </script>
</body>
</html>

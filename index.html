<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HELM77ZX Captcha</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }
        .captcha-container {
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 15px;
            width: 100%;
            max-width: 290px;
            background: #ffffff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .title {
            font-size: 14px;
            font-weight: bold;
            color: #4a5568;
            margin-bottom: 10px;
            text-align: center;
        }
        .captcha-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            gap: 10px;
        }
        /* Стилизация и анимация текста капчи для усложнения распознавания */
        .captcha-visual {
            background: #edf2f7;
            border: 1px dashed #cbd5e0;
            padding: 8px;
            font-weight: bold;
            font-style: italic;
            letter-spacing: 5px;
            border-radius: 4px;
            user-select: none;
            font-size: 20px;
            color: #2d3748;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.15);
            flex-grow: 1;
            text-align: center;
            animation: distort 4s infinite alternate ease-in-out;
        }
        @keyframes distort {
            0% { transform: skewX(-4deg) scale(0.98); }
            100% { transform: skewX(4deg) scale(1.02); }
        }
        .refresh-btn {
            background: #edf2f7;
            border: 1px solid #cbd5e0;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        .refresh-btn:hover {
            background: #e2e8f0;
        }
        .input-field {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e0;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
            margin-bottom: 10px;
            outline: none;
            text-align: center;
        }
        .input-field:focus {
            border-color: #3182ce;
        }
        .verify-btn {
            width: 100%;
            background-color: #3182ce;
            color: white;
            border: none;
            padding: 10px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .verify-btn:hover {
            background-color: #2b6cb0;
        }
        .status {
            font-size: 12px;
            text-align: center;
            margin-top: 8px;
            font-weight: bold;
            display: none;
        }
        .status.error { color: #e53e3e; display: block; }
        .status.success { color: #38a169; display: block; }
    </style>
</head>
<body>

<div class="captcha-container">
    <div class="title">Подтвердите, что вы не робот</div>
    
    <div class="captcha-box">
        <!-- Сюда выводится случайный код -->
        <div id="captchaCode" class="captcha-visual">------</div>
        <button type="button" class="refresh-btn" id="refreshBtn">🔄</button>
    </div>

    <!-- Поле ввода для пользователя -->
    <input type="text" id="userInput" class="input-field" placeholder="Введите код с картинки" autocomplete="off">
    
    <button type="button" id="verifyBtn" class="verify-btn">Проверить</button>
    
    <div id="statusMessage" class="status"></div>
</div>

<script>
    let currentCaptcha = "";

    // Генерация случайного 6-значного проверочного кода
    function generateCaptcha() {
        const chars = "23456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghkmnpqrstuvwxyz"; // Исключены схожие символы 0, 1, o, l
        let result = "";
        for (let i = 0; i < 6; i++) {
            result += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        currentCaptcha = result;
        document.getElementById("captchaCode").innerText = result;
        
        // Очищаем статус и инпут
        const status = document.getElementById("statusMessage");
        status.style.display = "none";
    }

    // Привязываем генерацию к кнопке обновления
    document.getElementById("refreshBtn").addEventListener("click", generateCaptcha);

    // Логика проверки по клику на "Проверить"
    document.getElementById("verifyBtn").addEventListener("click", function() {
        const userInput = document.getElementById("userInput").value.trim();
        const status = document.getElementById("statusMessage");

        // Сравниваем без учета регистра символов для удобства человека
        if (userInput.toLowerCase() === currentCaptcha.toLowerCase()) {
            status.className = "status success";
            status.innerText = "✓ Успешно! Передаем данные...";
            
            // Блокируем интерфейс после успеха
            document.getElementById("userInput").disabled = true;
            document.getElementById("verifyBtn").disabled = true;
            document.getElementById("verifyBtn").style.backgroundColor = "#cbd5e0";

            // ГЛАВНОЕ: Передаем родителю (основному сайту) сообщение через postMessage
            window.parent.postMessage({
                status: 'success',
                token: currentCaptcha
            }, '*');
            
        } else {
            status.className = "status error";
            status.innerText = "Неверный код. Попробуйте еще раз.";
            document.getElementById("userInput").value = "";
            generateCaptcha(); // Генерируем новую капчу при ошибке
        }
    });

    // Инициализация при первой загрузке внутри iframe
    window.onload = generateCaptcha;
</script>

</body>
</html>
